global:
  scrape_interval: 15s
  scrape_timeout: 15s
  evaluation_interval: 15s
# scrape metrics from the prometheus server itself
scrape_configs:
- job_name: prometheus
  scrape_interval: 15s
  scrape_timeout: 15s
  metrics_path: /metrics
  static_configs:
  - targets:
    - localhost:9090
# Discover targets from Eureka and scrape metrics from them (Whitebox monitoring)
- job_name: eureka-discovery
  scrape_interval: 15s
  scrape_timeout: 15s
  eureka_sd_configs:
  - server: http://prometheus-eureka-server:8761/eureka
    refresh_interval: 30s
  relabel_configs:
  - source_labels: [__meta_eureka_app_name]
    target_label: application
  - source_labels: [__meta_eureka_app_instance_metadata_metrics_path]
    target_label: __metrics_path__
  - source_labels: [__address__]
    target_label: instance


    global:
  scrape_interval: 15s # 기본 스크레이핑 간격
  scrape_timeout: 15s
  evaluation_interval: 15s

# Prometheus 서버 자체의 메트릭 스크랩 설정
global:
  scrape_interval: 15s # 기본 스크레이핑 간격
  scrape_timeout: 15s
  evaluation_interval: 15s

# Prometheus 서버 자체의 메트릭 스크랩 설정
scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    scrape_timeout: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9090

# Eureka를 통해 발견한 대상들을 스크랩 (화이트박스 모니터링)
  - job_name: eureka-discovery
    scrape_interval: 15s
    scrape_timeout: 15s
    eureka_sd_configs:
      - server: http://3.38.141.44/:8761/eureka/ # Eureka 서버 URL
        refresh_interval: 30s

    relabel_configs:
      # 서비스 이름을 application 라벨로 지정
      - source_labels: [__meta_eureka_app_name]
        target_label: application
      
      # Eureka 메타데이터의 metrics_path를 __metrics_path__로 지정
      - source_labels: [__meta_eureka_app_instance_metadata_metrics_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      # 인스턴스의 주소 정보 설정
      - source_labels: [__address__, __meta_eureka_app_instance_metadata_prometheus_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

      # 등록된 서비스 중에서 특정 메타데이터(prometheus.scrape = true)가 있는 경우만 스크랩
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_scrape]
        action: keep
        regex: true


global:
  scrape_interval: 15s
  scrape_timeout: 15s
  evaluation_interval: 15s
# scrape metrics from the prometheus server itself
scrape_configs:
- job_name: prometheus
  scrape_interval: 15s
  scrape_timeout: 15s
  metrics_path: /actuator/prometheus
  static_configs:
  - targets:
    - localhost:9090
# Discover targets from Eureka and scrape metrics from them (Whitebox monitoring)
- job_name: eureka-discovery
  scrape_interval: 15s
  scrape_timeout: 15s
  eureka_sd_configs:
  - server: http://3.38.141.44:8761/eureka/
  relabel_configs:
  - source_labels: [__meta_eureka_app_name]
    target_label: application
  - source_labels: [__meta_eureka_app_instance_metadata_metrics_path]
    target_label: __metrics_path__
  - source_labels: [__address__]
    target_label: instance
# Discover targets from Eureka and probe the health endpoints via the Blackbox Exporter (Blackbox monitoring)
- job_name: blackbox-via-service-discovery
  params:
    module:
    - http_2xx
  scrape_interval: 15s
  scrape_timeout: 15s
  metrics_path: /probe
  eureka_sd_configs:
    - server: http://3.38.141.44:8761/eureka/
      refresh_interval: 30s
  relabel_configs:
  - source_labels: [__meta_eureka_app_name]
    target_label: application
  - source_labels: [__meta_eureka_app_instance_healthcheck_url]
    target_label: __param_target
  - source_labels: [__address__]
    target_label: instance
  - target_label: __address__
    replacement: blackbox-exporter:9115


scrape_configs:
  # Make Prometheus scrape itself for metrics.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Discover Eureka services to scrape.
  - job_name: 'eureka-server'

    # Scrape Eureka itself to discover new services.
    eureka_sd_configs:
      - server: http://3.38.141.44:8761/eureka
    relabel_configs:
       - source_labels: [__meta_eureka_app_instance_metadata_prometheus_path]
         action: replace
         target_label: __metrics_path__
         regex: (.+)
       - source_labels: [__address__, __meta_eureka_app_instance_metadata_prometheus_port]
         action: replace
         regex: ([^:]+)(?::\d+)?;(\d+)
         replacement: $1:$2
         target_label: __address__