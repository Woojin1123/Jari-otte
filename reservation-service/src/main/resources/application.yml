server:
  port: 8082

spring:
  application:
    name: reservation-service
  # Bean 오버라이딩 허용 설정 추가
  main:
    allow-bean-definition-overriding: true

  datasource:
    master:
      jdbc-url: ${DB_URL_RESERVATION}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 5
        idle-timeout: 300000  # 5분
        connection-timeout: 20000  # 20초
        pool-name: MasterHikariPool

    slave:
      jdbc-url: ${DB_URL_RESERVATION_SLAVE}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 10
        idle-timeout: 300000
        connection-timeout: 20000
        pool-name: SlaveHikariPool

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    topic:
      payment-events: payment-events
      reservation-events: reservation-events
      reservation-created: seat.reservation.created
      reservation-created-compensation: seat.reservation.created.compensation
    consumer:
      group-id: reservation-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

